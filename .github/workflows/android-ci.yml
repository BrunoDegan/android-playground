name: Android Playground CI configuration

on:
  push:
    branches: [ main, master, release ]
  pull_request:
    branches: [ main, master, release ]

jobs:
  gradle-build:
    name: gradle-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clear current gradle cache for clean build
        run: ./gradlew clean

      - name: Gradle build
        run: ./gradlew build

  ktlint-check:
    name: ktlint-check
    needs: gradle-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run KtLint Check
        run: ./gradlew ktlintCheck

  stability_check:
    name: Compose Stability Check
    runs-on: ubuntu-latest
    needs: gradle-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: compose stability check
        run: ./gradlew stabilityCheck
  
  android-jvm-tests:
    name: android-jvm-tests
    needs: ktlint-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload test artifacts and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/build/reports/tests/*.xml'

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug